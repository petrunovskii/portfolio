<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yurii Petrunovskii. Tech and AI communications</title>
<meta name="description" content="Portfolio of Yurii Petrunovskii: product launches, developer and B2B SaaS communications at Yandex and Avito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F9; --ink:#141B2D; --muted:#566076; --rule:#D5DAE3; --link:#1F3FD0;
  --mark:#FFE66B; --mark-ink:#141B2D; --chip:#E7EAF0;
  --sans:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"PT Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1320; --ink:#E9ECF3; --muted:#9AA4B8; --rule:#2A3348; --link:#9DB2FF;
    --mark:#5C4E00; --mark-ink:#FFF3B0; --chip:#1B2335;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1320; --ink:#E9ECF3; --muted:#9AA4B8; --rule:#2A3348; --link:#9DB2FF;
  --mark:#5C4E00; --mark-ink:#FFF3B0; --chip:#1B2335;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:17px; line-height:1.55}
a{color:var(--link); text-underline-offset:.18em; text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--link); outline-offset:3px; border-radius:2px}
img{max-width:100%; height:auto; display:block}
mark{background:var(--mark); color:var(--mark-ink); padding:.04em .22em; border-radius:2px; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.wrap{max-width:1040px; margin:0 auto; padding:0 24px}

.top{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:18px 0}
.top-name{font-weight:600; font-size:15px}
.seg{display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden}
.seg button{font:inherit; font-size:14px; padding:6px 14px; border:0; background:transparent; color:var(--muted); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

.hero{padding:56px 0 44px; border-bottom:1px solid var(--rule)}
.portrait{float:right; width:clamp(150px,19vw,210px); height:auto; aspect-ratio:1; object-fit:cover; border-radius:6px; margin:6px 0 20px 36px}
.hero h1{font-size:clamp(44px,8.4vw,104px); line-height:.94; letter-spacing:-.035em; font-weight:800; margin:0 0 22px}
.hero-role{font-size:clamp(19px,2.3vw,24px); font-weight:600; margin:0 0 26px}
.hero-lead{font-family:var(--serif); font-size:clamp(20px,2.5vw,27px); line-height:1.5; max-width:34em; margin:0 0 30px}
.hero-contact{display:flex; flex-wrap:wrap; gap:10px 26px; font-size:16px; margin:0; padding:0; list-style:none}
.hero-contact li{color:var(--muted)}

section{padding:52px 0}
section + section{border-top:1px solid var(--rule)}
h2{font-size:clamp(26px,3.4vw,38px); letter-spacing:-.02em; line-height:1.1; margin:0 0 8px; font-weight:800}
.sec-note{color:var(--muted); margin:0 0 26px; max-width:60ch}

.filter{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 8px}
.filter button{font:inherit; font-size:15px; padding:8px 15px; border-radius:999px; border:1px solid var(--rule); background:transparent; color:var(--ink); cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}

.case{padding:30px 0; border-top:1px solid var(--rule); display:grid; grid-template-columns:minmax(0,1fr); gap:6px}
.case:first-of-type{border-top:0}
.case-meta{color:var(--muted); font-size:15px; margin:0}
.case h3{font-size:clamp(22px,2.7vw,30px); line-height:1.18; letter-spacing:-.015em; margin:2px 0 6px; font-weight:800; max-width:26em}
.case-lead{font-family:var(--serif); font-size:19px; line-height:1.5; margin:0 0 6px; max-width:38em}
details{margin-top:6px}
summary{cursor:pointer; color:var(--link); font-weight:500; width:fit-content; padding:4px 0}
.case-body{max-width:66ch; padding-top:10px}
.case-body h4{font-size:15px; font-weight:600; color:var(--muted); margin:20px 0 4px}
.case-body p{margin:0 0 8px}
.case-body ul{margin:0 0 8px; padding-left:1.15em}
.case-body li{margin:0 0 6px}
.photos{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:14px 0 4px; max-width:none}
.photos img{width:100%; height:230px; object-fit:cover; border-radius:4px}
.photos figcaption{font-size:14px; color:var(--muted); grid-column:1/-1}
figure{margin:0}

.press{list-style:none; margin:0; padding:0; max-width:74ch}
.press li{display:grid; grid-template-columns:9.5em minmax(0,1fr); gap:6px 18px; padding:11px 0; border-top:1px solid var(--rule)}
.press li:first-child{border-top:0}
.press .outlet{font-weight:600}
.press a{font-family:var(--serif); font-size:18px}

.bg{width:100%; border-collapse:collapse; max-width:74ch}
.bg th,.bg td{text-align:left; vertical-align:top; padding:11px 18px 11px 0; border-top:1px solid var(--rule); font-weight:400}
.bg tr:first-child th,.bg tr:first-child td{border-top:0}
.bg th{font-weight:600; width:9.5em}
.bg .when{color:var(--muted); white-space:nowrap}
.tablewrap{overflow-x:auto}
.two{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:32px; max-width:74ch; margin-top:34px}
.two h3{font-size:17px; margin:0 0 6px}
.two p{margin:0 0 6px}

footer{padding:44px 0 60px; border-top:1px solid var(--rule)}
footer p{margin:0 0 6px; max-width:60ch}
.foot-big{font-size:clamp(22px,3vw,32px); font-weight:800; letter-spacing:-.02em; margin-bottom:14px}

@media (max-width:640px){
  body{font-size:16px}
  .hero{padding-top:34px}
  .portrait{float:none; width:104px; margin:0 0 18px}
  .press li{grid-template-columns:1fr; gap:2px}
  .photos{grid-template-columns:1fr 1fr}
  .photos img{height:170px}
  .two{grid-template-columns:1fr}
  .bg th{width:auto}
  .bg .when{white-space:normal}
}
@media print{ .top,.filter,summary{display:none} details>*{display:block} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="top-name" id="topname"></span>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ru" aria-pressed="false">RU</button>
    </div>
  </div>

  <header class="hero">
    <img class="portrait" id="portrait" width="341" height="341" alt="">
    <h1 id="h1"></h1>
    <p class="hero-role" id="role"></p>
    <p class="hero-lead" id="lead"></p>
    <ul class="hero-contact" id="contact"></ul>
  </header>

  <main>
    <section id="work">
      <h2 id="work-h"></h2>
      <p class="sec-note" id="work-note"></p>
      <div class="filter" id="filter" role="group"></div>
      <div id="cases"></div>
    </section>

    <section id="press">
      <h2 id="press-h"></h2>
      <p class="sec-note" id="press-note"></p>
      <ul class="press" id="press-list"></ul>
    </section>

    <section id="bg">
      <h2 id="bg-h"></h2>
      <div class="tablewrap"><table class="bg" id="bg-table"></table></div>
      <div class="two" id="two"></div>
    </section>
  </main>

  <footer>
    <p class="foot-big" id="foot-big"></p>
    <p id="foot-1"></p>
    <p id="foot-2"></p>
  </footer>
</div>

 ["ComNews","Авито Тех приобрела платформу EXPF Sigma","Avito Tech acquires the EXPF Sigma platform","https://www.comnews.ru/content/240026/2025-07-04/2025-w27/1010/avito-tekh-priobrela-platformu-expf-sigma"],
 ["Inc. Russia","На «Авито» появилась беспроцентная рассрочка","Interest-free instalments arrive on Avito","https://incrussia.ru/news/na-avito-poyavilas-besprotsentnaya-rassrochka-dlya-polzovatelej/"],
 ["vc.ru","Авито первым на C2C-рынке запустил беспроцентную рассрочку","Avito is first on the C2C market with interest-free instalments","https://vc.ru/services/2179080-avito-besprocentnaya-rassrochka"],
 ["Kod.ru","Авито вновь проведёт большую конференцию для руководителей в ИТ","Avito to hold its conference for IT leaders again","https://kod.ru/avito-tech-conf-2026-it-leaders-ai"]
];

const BG = {
en:[
 ["Avito Tech","Independent communications consultant. Customer case studies and product content for Trisigma.","Since September 2026"],
 ["Avito","PR Partner, Technology. Communications for Trisigma, fintech products and the engineering brand.","June 2025 to May 2026"],
 ["Yandex","PR Manager for AI and technology products, previously International PR Manager for CIS markets.","June 2024 to May 2025"],
 ["Mars","Corporate Communications Specialist. ESG and employee volunteering programmes.","October 2023 to June 2024"],
 ["PBN","PR agency, intern. Clients included Yandex Go, Yandex Drive, Yandex Delivery and Ozon.","October 2022 to October 2023"]
],
ru:[
 ["Авито Тех","Независимый консультант по коммуникациям. Клиентские кейсы и продуктовые материалы для Trisigma.","с сентября 2026"],
 ["Авито","PR-партнёр Tech. Коммуникации Trisigma, финтех-продуктов и технологического бренда.","с июня 2025 по май 2026"],
 ["Яндекс","PR-менеджер технологических и AI-продуктов, ранее PR-менеджер международных проектов в СНГ.","с июня 2024 по май 2025"],
 ["Mars","Специалист по корпоративным коммуникациям. ESG и программы корпоративного волонтёрства.","с октября 2023 по июнь 2024"],
 ["PBN","PR-агентство, стажёр. Клиенты Яндекс Go, Драйв, Доставка и Ozon.","с октября 2022 по октябрь 2023"]
]};
const EDU = {
en:["HSE University, Moscow. Master's degree in International Business, 2026.","HSE University and Kyung Hee University, Seoul. Double bachelor's degree in Economics and Politics in Asia, 2019 to 2023.","Waseda University, Tokyo. Exchange semester."],
ru:["НИУ ВШЭ, магистратура «Международный бизнес», 2026 год.","НИУ ВШЭ и Kyung Hee University (Сеул), программа двух дипломов «Экономика и политика в Азии», с 2019 по 2023 год.","Waseda University (Токио), семестр по обмену."]};
const LANGS = {en:["Russian, native","English, C1","Japanese, B2"], ru:["Русский, родной","Английский, C1","Японский, B2"]};

let state = {lang:"en", role:"all"};
try{
  const s = JSON.parse(localStorage.getItem("yp-portfolio")||"null");
  if(s && T[s.lang]) state.lang = s.lang;
}catch(e){}
(function fromHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/,""));
  if(T[h.get("lang")]) state.lang = h.get("lang");
  else if(!localStorageHasLang() && (navigator.language||"").toLowerCase().startsWith("ru")) state.lang = "ru";
  if(ROLES.includes(h.get("role"))) state.role = h.get("role");
})();
function localStorageHasLang(){ try{ return !!localStorage.getItem("yp-portfolio"); }catch(e){ return false; } }

const $ = id => document.getElementById(id);
const el = (tag, attrs, html) => { const n = document.createElement(tag); if(attrs) for(const k in attrs) n.setAttribute(k, attrs[k]); if(html!==undefined) n.innerHTML = html; return n; };

function render(){
  const t = T[state.lang];
  document.documentElement.lang = state.lang;
  $("topname").textContent = t.name;
  $("h1").textContent = t.name;
  $("portrait").src = IMG.me; $("portrait").alt = t.name;
  $("role").textContent = t.roleLine[state.role];
  $("lead").innerHTML = t.lead;

  const c = $("contact"); c.innerHTML = "";
  c.appendChild(el("li",null,'<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'));
  c.appendChild(el("li",null,'<a href="'+TELEGRAM+'" rel="noopener" target="_blank">Telegram</a>'));
  c.appendChild(el("li",null,'<a href="'+LINKEDIN+'" rel="noopener" target="_blank">LinkedIn</a>'));
  const cvUrl = CV[state.role];
  c.appendChild(el("li",null, cvUrl ? '<a href="'+cvUrl+'" rel="noopener" target="_blank">'+t.cv+'</a>' : '<a href="mailto:'+EMAIL+'?subject=CV">'+t.cvAsk+'</a>'));
  t.contact.forEach(x => c.appendChild(el("li",null,x)));

  $("work-h").textContent = t.workH; $("work-note").textContent = t.workNote;
  const f = $("filter"); f.innerHTML = ""; f.setAttribute("aria-label", t.workH);
  ROLES.forEach(r => { const b = el("button",{type:"button","aria-pressed": String(state.role===r),"data-role":r}, t.filter[r]); f.appendChild(b); });

  const box = $("cases"); box.innerHTML = "";
  ORDER[state.role].map(id => CASES.find(x => x.id===id)).forEach(x => {
    const d = x[state.lang], L = t.labels;
    const a = el("article",{class:"case",id:x.id});
    a.appendChild(el("p",{class:"case-meta"}, d.meta));
    a.appendChild(el("h3",null,d.title));
    a.appendChild(el("p",{class:"case-lead"}, d.lead));
    const det = el("details"); det.appendChild(el("summary",null,t.open));
    const b = el("div",{class:"case-body"});
    const li = arr => "<ul>"+arr.map(s=>"<li>"+s+"</li>").join("")+"</ul>";
    let html = "<h4>"+L.context+"</h4><p>"+d.context+"</p><h4>"+L.task+"</h4><p>"+d.task+"</p><h4>"+L.role+"</h4><p>"+d.role+"</p><h4>"+L.did+"</h4>"+li(d.did);
    if(x.photos){
      const cap = state.lang==="ru" ? "Билборды у офисов IT-компаний и стакан с напитком Lead's flip, сентябрь 2025." : "Billboards near tech offices and the Lead's flip cup, September 2025.";
      html += '<figure class="photos"><img src="'+IMG.bb2+'" alt="'+cap+'" loading="lazy"><img src="'+IMG.bb1+'" alt="" loading="lazy"><img src="'+IMG.cup+'" alt="" loading="lazy"><figcaption>'+cap+'</figcaption></figure>';
    }
    html += "<h4>"+L.results+"</h4>"+li(d.results)+"<h4>"+L.note+"</h4><p>"+d.note+"</p>";
    html += "<h4>"+L.links+"</h4><p>"+x.links.map(l=>'<a href="'+l[1]+'" rel="noopener" target="_blank">'+l[0]+'</a>').join(", ")+"</p>";
    b.innerHTML = html; det.appendChild(b); a.appendChild(det); box.appendChild(a);
  });

  $("press-h").textContent = t.pressH; $("press-note").textContent = t.pressNote;
  const pl = $("press-list"); pl.innerHTML = "";
  PRESS.forEach(p => pl.appendChild(el("li",null,'<span class="outlet">'+p[0]+'</span><a href="'+p[3]+'" rel="noopener" target="_blank">'+(state.lang==="ru"?p[1]:p[2])+'</a>')));

  $("bg-h").textContent = t.bgH;
  $("bg-table").innerHTML = BG[state.lang].map(r=>'<tr><th scope="row">'+r[0]+'</th><td>'+r[1]+'</td><td class="when">'+r[2]+'</td></tr>').join("");
  $("two").innerHTML = '<div><h3>'+t.eduH+'</h3>'+EDU[state.lang].map(x=>"<p>"+x+"</p>").join("")+'</div><div><h3>'+t.langH+'</h3>'+LANGS[state.lang].map(x=>"<p>"+x+"</p>").join("")+'</div>';

  $("foot-big").textContent = t.footBig;
  $("foot-1").innerHTML = t.foot1+'<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>';
  $("foot-2").innerHTML = t.foot2+'<a href="'+TELEGRAM+'" rel="noopener" target="_blank">Telegram</a>, <a href="'+LINKEDIN+'" rel="noopener" target="_blank">LinkedIn</a>';

  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang===state.lang)));
  document.title = t.name + ". " + t.roleLine[state.role];
  try{ localStorage.setItem("yp-portfolio", JSON.stringify({lang:state.lang})); }catch(e){}
  try{ history.replaceState(null,"","#lang="+state.lang+(state.role!=="all"?"&role="+state.role:"")); }catch(e){}
}

document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; state.lang = b.dataset.lang; render(); });
$("filter").addEventListener("click", e => { const b = e.target.closest("button"); if(!b) return; state.role = b.dataset.role; render(); });
render();
</script>
</body>
</html>
